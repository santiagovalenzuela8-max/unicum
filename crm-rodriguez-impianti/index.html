<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Rodriguez Impianti CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra laterale scura fissa (desktop) / barra in basso (telefono) + area di lavoro chiara a schede e tabelle */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#eaf0f4; --line:#d6e0e7;
  --fg:#16232d; --muted:#5d6f7c;
  --accent:#0f6fa8; --accent-fg:#ffffff; --accent-soft:#dcedf7;
  --side:#0e2433; --side-fg:#cfe1ec; --side-active:#1b3b52;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --warn:#b86a00; --warn-soft:#fdefd6; --bad:#c23b32; --bad-soft:#fbe1de;
  --heat:#d0612a;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b161e; --surface:#12212c; --surface-2:#182b38; --line:#24394a;
  --fg:#e3edf3; --muted:#8fa5b4;
  --accent:#4cb0ea; --accent-fg:#06202f; --accent-soft:#153a52;
  --side:#07121a; --side-fg:#b9cfdc; --side-active:#163246;
  --ok:#4fc38d; --ok-soft:#123528; --warn:#f0a83c; --warn-soft:#3a2a10; --bad:#f07067; --bad-soft:#3d1b19;
  --heat:#f08a55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b161e; --surface:#12212c; --surface-2:#182b38; --line:#24394a;
  --fg:#e3edf3; --muted:#8fa5b4;
  --accent:#4cb0ea; --accent-fg:#06202f; --accent-soft:#153a52;
  --side:#07121a; --side-fg:#b9cfdc; --side-active:#163246;
  --ok:#4fc38d; --ok-soft:#123528; --warn:#f0a83c; --warn-soft:#3a2a10; --bad:#f07067; --bad-soft:#3d1b19;
  --heat:#f08a55; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(140deg,#2a9fd8,#0f6fa8 60%,#d0612a);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.05;color:#fff;letter-spacing:.02em}
.brand-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;color:inherit;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-active)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #2a9fd8}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:12px;background:#c23b32;color:#fff;border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:12px;opacity:.75;padding:0 6px;display:flex;flex-direction:column;gap:8px}
.side-foot button{background:transparent;border:1px solid #2c4a5f;color:inherit;border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left}

.main{min-width:0;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-size:28px;margin-right:auto}
.demo-tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:3px 9px;border-radius:20px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 10px;min-width:0;flex:0 1 300px}
.search input{border:0;background:transparent;padding:8px 0;outline:none;width:100%;min-width:0}
a.btn{text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn svg{width:16px;height:16px}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi.alert .val{color:var(--bad)}
.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:18px;margin-right:auto}
.panel-b{padding:14px 16px}
.panel-b.flush{padding:0}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.cell-main{font-weight:600}
.cell-sub{font-size:13px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.inst{color:var(--accent);border-color:currentColor}
.tag.man{color:var(--ok);border-color:currentColor}
.tag.gua{color:var(--bad);border-color:currentColor}
.tag.sop{color:var(--muted)}
.tag.heat{color:var(--heat);border-color:currentColor}

.agenda{display:flex;flex-direction:column}
.ag-item{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:start;cursor:pointer}
.ag-item:last-child{border-bottom:0}
.ag-item:hover{background:var(--surface-2)}
.ag-time{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.ag-title{font-weight:600}
.day-head{font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 16px 6px;background:var(--surface-2);border-bottom:1px solid var(--line)}

.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px 0;border-bottom:1px solid var(--line);position:relative}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bar-stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.bar-stack span{display:block}
.bar-v{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar-x{display:flex;gap:10px;padding:6px 4px 0}
.bar-x span{flex:1;text-align:center;font-size:12px;color:var(--muted);text-transform:capitalize}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,22,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:50;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-h h2{font-size:22px}
.drawer-h .x{margin-left:auto}
.drawer-b{overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec-t{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.unit{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.unit-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.unit-name{font-weight:600}
.unit-specs{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 14px 16px}
.tl::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl.gua::before{border-color:var(--bad)}
.tl.man::before{border-color:var(--ok)}
.tl-d{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.copy{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:12px;padding:0 4px}

form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
form input,form select,form textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;font-weight:400;font-size:15px;color:var(--fg);width:100%;min-width:0}
form textarea{min-height:76px;resize:vertical}
.form-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:6px}
.lines td input{padding:6px 8px}
.total-row{display:flex;justify-content:space-between;font-size:15px;padding:4px 0}
.total-row.big{font-family:var(--f-display);font-size:22px;font-weight:600;border-top:1px solid var(--line);padding-top:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.gas-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.gas-bar span{display:block;height:100%;background:var(--accent)}


/* accesso demo: look scuro fisso, uguale in entrambi i temi */
.login{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 500px at 85% -10%,#1d5f8a 0,transparent 60%),linear-gradient(160deg,#0b1d29,#0e2433 55%,#2b1b12);display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:#e6f0f6;overflow-y:auto}
.login-card{width:min(410px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login-card h2{font-size:26px;color:#fff}
.login-card p{margin:0;color:#a9c3d3;font-size:14px}
.login-card label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#a9c3d3;font-weight:600}
.login-card input{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:10px 12px;color:#fff;font-size:15px}
.login-card .btn.primary{justify-content:center;padding:11px;background:#2a9fd8;border-color:#2a9fd8;color:#04202f;font-weight:600}
.login-feat{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.login-feat span{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:2px 9px;color:#bcd3e1}
.login-foot{font-size:12px;color:#7f9aab;text-align:center}

/* calendario settimanale */
.week{display:grid;grid-template-columns:128px repeat(6,minmax(128px,1fr));min-width:900px}
.week>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;min-height:92px;min-width:0}
.week>div:nth-child(7n){border-right:0}
.week .wk-h{background:var(--surface-2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-height:0}
.week .wk-h.today{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.week .wk-t{font-weight:600;font-size:14px;background:var(--surface-2)}
.week .wk-today{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:4px 7px;margin-bottom:5px;font-size:12px;cursor:pointer;color:var(--fg);line-height:1.35}
.ev:hover{filter:brightness(.97)}
.ev.man{border-color:var(--ok);background:var(--ok-soft)}
.ev.gua{border-color:var(--bad);background:var(--bad-soft)}
.ev.sop{border-color:var(--muted);background:var(--surface-2)}
.ev.done{opacity:.6}
.ev b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--surface);padding:5px 14px;font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* rapportino */
form label.check{flex-direction:row;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px;font-weight:500;color:var(--fg);cursor:pointer}
form label.check input{width:18px;height:18px;flex:none;accent-color:var(--ok)}
form .row.r3{grid-template-columns:1fr 1fr 1fr}
.sig{border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;width:100%;height:160px;display:block;cursor:crosshair}
.sig-img{background:#fff;border-radius:8px;border:1px solid var(--line);max-width:100%;height:auto;display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.checklist li::before{content:"✓";color:var(--ok);font-weight:700;margin-right:8px}
.checklist li.no::before{content:"–";color:var(--muted)}
.measures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.measures div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.measures b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.measures span{font-size:12px;color:var(--muted)}

/* anteprima messaggio stile chat: palette fissa */
.wa{background:#e9e1d8;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.wa-msg{align-self:flex-end;background:#d9fdd3;color:#111b21;border-radius:8px 0 8px 8px;padding:8px 10px 4px;max-width:92%;font-size:14px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.wa-meta{font-size:11px;color:#667781;text-align:right;margin-top:2px}
.wa.sms{background:#f2f2f7}.wa.sms .wa-msg{background:#0b84ff;color:#fff;border-radius:16px 16px 4px 16px}.wa.sms .wa-meta{color:#d5e8ff}
.wa.mail{background:#eef2f5}.wa.mail .wa-msg{align-self:stretch;max-width:100%;background:#fff;border-radius:6px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:30;gap:0}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;align-items:center}
  .nav a[aria-current="page"]{box-shadow:inset 0 2px 0 #2a9fd8}
  .nav .count{position:absolute;margin:0 0 0 22px;font-size:10px;padding:0 5px}
  .nav a{position:relative}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:96px}
  .topbar h1{font-size:24px;width:100%}
  .search{flex:1 1 100%}
  .kpi .val{font-size:26px}
  form .row{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .dl dt{margin-top:6px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11"/><path d="M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5"/></svg>
      </div>
      <div><div class="brand-name">Rodriguez<br>Impianti</div><div class="brand-sub">Gestione clienti</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span>Versione demo · dati di esempio</span>
      <button type="button" id="reset">Ripristina dati demo</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="overlay"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);

const daysTo=s=>Math.round((parse(s)-today)/DAY);

const KEY="rodriguez-crm-demo-v1";
let db;
try{const raw=localStorage.getItem(KEY);db=raw?JSON.parse(raw):null}catch(e){db=null}
if(!db||!db.clienti)db=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};

const cli=id=>db.clienti.find(c=>c.id===id)||{nome:"—"};
const unitsOf=id=>db.unita.filter(u=>u.cliente===id);
const co2=u=>(u.kg*(GWP[u.gas]||0)/1000);
const qTot=q=>q.righe.reduce((s,r)=>s+r[1]*r[2],0);
const manState=u=>{const d=daysTo(u.prossimaMan);return d<0?{c:"bad",t:"Scaduta da "+(-d)+" gg"}:d<=30?{c:"warn",t:"Tra "+d+" gg"}:{c:"ok",t:fmtD(u.prossimaMan)}};
const statoPill=s=>({completato:"ok","in corso":"info",pianificato:"",annullato:"bad"}[s]??"");
const qPill=s=>({accettato:"ok",inviato:"info",rifiutato:"bad",bozza:""}[s]??"");

function topbar(title,actions=""){
  return `<div class="topbar"><h1>${title}</h1><span class="demo-tag">Demo</span>
  <label class="search">${svg("search",'width="16" height="16" class="muted"')}<input id="q" type="search" placeholder="Cerca cliente, città, modello, matricola…" value="${esc(q)}" aria-label="Cerca"></label>${actions}</div>`;
}
const match=(...f)=>!q||f.join(" ").toLowerCase().includes(q.toLowerCase());

function vDashboard(){
  const oggi=db.interventi.filter(i=>i.data===iso(today)&&i.stato!=="annullato");
  const sett=db.interventi.filter(i=>{const d=daysTo(i.data);return d>=0&&d<7&&i.stato!=="annullato"});
  const scad=db.unita.filter(u=>daysTo(u.prossimaMan)<0);
  const imm=db.unita.filter(u=>{const d=daysTo(u.prossimaMan);return d>=0&&d<=30});
  const aperti=db.preventivi.filter(p=>p.stato==="inviato");
  const valAp=aperti.reduce((s,p)=>s+qTot(p),0);
  const fGas=db.unita.filter(u=>co2(u)>=5);
  /* lavori ultimi 6 mesi per tipo */
  const months=[];for(let k=5;k>=0;k--){const d=new Date(today.getFullYear(),today.getMonth()-k,1);months.push(d)}
  const agg=months.map(m=>{const r={inst:0,man:0,gua:0};db.interventi.forEach(i=>{const d=parse(i.data);if(d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear()&&i.stato==="completato"&&r[i.tipo]!==undefined)r[i.tipo]++});
    /* volume storico di esempio per dare forma al grafico */
    const base=[[2,9,3],[3,11,4],[5,14,6],[6,12,5],[4,10,3],[3,8,2]][months.indexOf(m)];
    return {m,inst:r.inst+base[0],man:r.man+base[1],gua:r.gua+base[2]}});
  const max=Math.max(...agg.map(a=>a.inst+a.man+a.gua));
  const col={inst:"var(--accent)",man:"var(--ok)",gua:"var(--bad)"};
  const bars=agg.map(a=>{const t=a.inst+a.man+a.gua;return `<div class="bar-col"><span class="bar-v">${t}</span><div class="bar-stack" style="height:${t/max*82}%">${["inst","man","gua"].map(k=>`<span style="height:${a[k]/t*100}%;background:${col[k]}"></span>`).join("")}</div></div>`}).join("");
  return topbar("Buongiorno, Luis",`<button class="btn primary" data-act="new-int">${svg("plus")}Nuovo intervento</button>`)+`
  <div class="grid kpis">
    <div class="kpi"><span class="lbl">Interventi oggi</span><span class="val">${oggi.length}</span><span class="sub">${sett.length} nei prossimi 7 giorni</span></div>
    <div class="kpi alert"><span class="lbl">Manutenzioni scadute</span><span class="val">${scad.length}</span><span class="sub">${imm.length} in scadenza entro 30 gg</span></div>
    <div class="kpi"><span class="lbl">Preventivi in attesa</span><span class="val">${aperti.length}</span><span class="sub num">${eur(valAp)} da confermare</span></div>
    <div class="kpi"><span class="lbl">Impianti seguiti</span><span class="val">${db.unita.length}</span><span class="sub">${fGas.length} soggetti a controllo F-gas</span></div>
  </div>
  <div class="grid two" style="margin-top:16px">
    <section class="panel"><div class="panel-h"><h2>Agenda dei prossimi giorni</h2><a class="btn small ghost" href="#agenda">Vedi tutto</a></div>
      <div class="agenda">${agendaList(db.interventi.filter(i=>{const d=daysTo(i.data);return d>=0&&d<4}),true)}</div></section>
    <div class="grid" style="align-content:start">
      <section class="panel"><div class="panel-h"><h2>Da richiamare</h2><span class="muted" style="font-size:13px">manutenzioni scadute</span></div>
        <div class="panel-b flush">${scad.length?scad.sort((a,b)=>a.prossimaMan.localeCompare(b.prossimaMan)).map(u=>{const c=cli(u.cliente);return `<div class="ag-item" data-cli="${c.id}" style="grid-template-columns:1fr auto"><div><div class="ag-title">${esc(c.nome)}</div><div class="cell-sub">${esc(u.marca)} ${esc(u.modello)} · <span class="mono">${esc(c.tel)}</span></div></div><span class="pill bad">${-daysTo(u.prossimaMan)} gg</span></div>`}).join(""):'<div class="empty">Nessuna manutenzione scaduta.</div>'}</div></section>
      <section class="panel"><div class="panel-h"><h2>Lavori chiusi</h2><span class="muted" style="font-size:13px">ultimi 6 mesi</span></div>
        <div class="panel-b"><div class="bars">${bars}</div><div class="bar-x">${agg.map(a=>`<span>${a.m.toLocaleDateString("it-IT",{month:"short"})}</span>`).join("")}</div>
        <div class="legend"><span><i style="background:var(--accent)"></i>Installazioni</span><span><i style="background:var(--ok)"></i>Manutenzioni</span><span><i style="background:var(--bad)"></i>Guasti</span></div></div></section>
    </div>
  </div>`;
}

function agendaList(list,compact){
  list=[...list].sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
  if(!list.length)return '<div class="empty">Nessun intervento in programma.</div>';
  let out="",last="";
  list.forEach(i=>{
    if(i.data!==last){last=i.data;const d=daysTo(i.data);out+=`<div class="day-head">${d===0?"Oggi · ":d===1?"Domani · ":d===-1?"Ieri · ":""}${fmtDay(i.data)}</div>`}
    const c=cli(i.cliente);
    out+=`<div class="ag-item" data-int="${i.id}"><span class="ag-time">${i.ora}</span>
      <div style="min-width:0"><div class="ag-title">${esc(c.nome)} <span class="tag ${i.tipo}">${TIPI[i.tipo]}</span></div>
      <div class="cell-sub">${esc(c.ind)}, ${esc(c.citta)} · ${esc(i.tecnico)}</div>${compact?"":`<div class="cell-sub">${esc(i.descr)}</div>`}</div>
      <span class="pill ${statoPill(i.stato)}">${i.stato}</span></div>`;
  });
  return out;
}

  ${agMode==="settimana"?weekView(list):`<div class="grid two">

    <section class="panel"><div class="panel-h"><h2>Carico tecnici</h2><span class="muted" style="font-size:13px">prossimi 7 giorni</span></div><div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
      ${TECNICI.map(t=>{const h=db.interventi.filter(i=>i.tecnico===t&&daysTo(i.data)>=0&&daysTo(i.data)<7).reduce((s,i)=>s+i.dur,0);return `<div><div style="display:flex;justify-content:space-between"><span style="font-weight:600">${t}</span><span class="num muted">${h} h / 40 h</span></div><div class="gas-bar"><span style="width:${Math.min(100,h/40*100)}%;${h>32?"background:var(--warn)":""}"></span></div></div>`}).join("")}
    </div>

    <div class="agenda">${agendaList(past.sort((a,b)=>b.data.localeCompare(a.data)).slice(0,8))}</div></section>

function weekView(list){
  const dow=(today.getDay()+6)%7;
  const start=addDays(today,today.getDay()===0?1:-dow);
  const days=[0,1,2,3,4,5].map(k=>addDays(start,k));
  let h='<div class="wk-h">Tecnico</div>'+days.map(d=>`<div class="wk-h ${iso(d)===iso(today)?"today":""}">${d.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})}</div>`).join("");
  TECNICI.forEach(t=>{
    const hrs=list.filter(i=>i.tecnico===t&&days.some(d=>iso(d)===i.data)&&i.stato!=="annullato").reduce((s,i)=>s+i.dur,0);
    h+=`<div class="wk-t">${t}<div class="cell-sub num">${hrs} h in settimana</div></div>`;
    days.forEach(d=>{const evs=list.filter(i=>i.tecnico===t&&i.data===iso(d)&&i.stato!=="annullato").sort((a,b)=>a.ora.localeCompare(b.ora));
      h+=`<div class="${iso(d)===iso(today)?"wk-today":""}">${evs.map(i=>`<button class="ev ${i.tipo} ${i.stato==="completato"?"done":""}" data-int="${i.id}"><span class="mono">${i.ora}</span> · ${TIPI[i.tipo]}<b>${esc(cli(i.cliente).nome)}</b>${esc(cli(i.cliente).citta)}</button>`).join("")}</div>`});
  });
  return `<section class="panel"><div class="panel-h"><h2>Settimana dal ${fmtD(iso(start))}</h2><span class="muted" style="font-size:13px">clicca un appuntamento per aprirlo</span></div><div class="table-wrap"><div class="week">${h}</div></div></section>`;
}

  const rate=acc.length?Math.round(db.preventivi.filter(p=>p.stato==="accettato").length/acc.length*100):0;

function vScadenze(){
  const list=db.unita.filter(u=>daysTo(u.prossimaMan)<=60&&match(cli(u.cliente).nome,u.modello,cli(u.cliente).citta)).sort((a,b)=>a.prossimaMan.localeCompare(b.prossimaMan));

  ${list.map(u=>{const c=cli(u.cliente);const st=manState(u);const planned=db.interventi.some(i=>i.cliente===c.id&&i.tipo==="man"&&daysTo(i.data)>=0&&i.stato!=="annullato");
    return `<tr><td><div class="cell-main">${esc(c.nome)}</div><div class="cell-sub mono">${esc(c.tel)}</div></td><td><div>${esc(u.marca)} ${esc(u.modello)}</div><div class="cell-sub">${co2(u)>=5?"Controllo F-gas obbligatorio":"Manutenzione ordinaria"}</div></td><td><span class="pill ${st.c}">${st.t}</span></td>
    <td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">${planned?'<span class="pill info">pianificata</span>':`${u.promemoria?`<span class="pill ok">avvisato ${fmtD(u.promemoria).slice(0,6)}</span>`:`<button class="btn small" data-remind="${u.id}">Promemoria</button>`}<button class="btn small" data-plan="${u.id}">Pianifica</button>`}</div></td></tr>`}).join("")||'<tr><td colspan="4" class="empty">Nessuna scadenza nei prossimi 60 giorni.</td></tr>'}
  </tbody></table></div></section>
  <div class="grid" style="align-content:start">
  <section class="panel"><div class="panel-h"><h2>Garanzie in scadenza</h2><span class="muted" style="font-size:13px">entro 4 mesi</span></div><div class="panel-b flush">
    ${gar.length?gar.map(u=>`<div class="ag-item" data-cli="${u.cliente}" style="grid-template-columns:1fr auto"><div><div class="ag-title">${esc(cli(u.cliente).nome)}</div><div class="cell-sub">${esc(u.marca)} ${esc(u.modello)}</div></div><span class="pill warn">${fmtD(u.garanzia)}</span></div>`).join(""):'<div class="empty">Nessuna garanzia in scadenza: proponi l\'estensione al prossimo intervento.</div>'}

    <div><b>Controllo perdite F-gas</b><div class="muted">Annuale per impianti da 5 t CO₂ eq in su (Reg. UE 2024/573). Registrare l'intervento nella Banca Dati FGAS entro 30 giorni.</div></div>

    <label>Cliente<select id="fq-cli">${db.clienti.map(c=>`<option value="${c.id}" ${c.id===forCli?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
    <label>Oggetto<input id="fq-ogg" required placeholder="es. Climatizzatore dual split 9000+12000 BTU"></label>
    <label>Detrazione applicabile<select id="fq-det"><option>50%</option><option>65%</option><option>—</option></select></label>
    <div class="panel table-wrap"><table class="lines"><thead><tr><th>Voce</th><th>Q.tà</th><th>Prezzo €</th></tr></thead><tbody id="fq-lines">
      ${[["Climatizzatore (unità interna + esterna)",1,890],["Kit staffe, linee frigorifere e scarico",1,120],["Installazione, vuoto e collaudo",1,350]].map((r,k)=>`<tr><td><input id="fq-d${k}" value="${r[0]}"></td><td style="width:70px"><input id="fq-q${k}" type="number" min="0" value="${r[1]}"></td><td style="width:110px"><input id="fq-p${k}" type="number" min="0" step="5" value="${r[2]}"></td></tr>`).join("")}
    </tbody></table></div>
    <div class="total-row big"><span>Totale IVA 10%</span><span class="num" id="fq-tot"></span></div>
    <div class="form-actions"><button type="button" class="btn" data-close>Annulla</button><button class="btn primary">Salva come bozza</button></div></form>`);
  const calc=()=>{let t=0;for(let k=0;k<3;k++)t+=(+$("#fq-q"+k).value||0)*(+$("#fq-p"+k).value||0);$("#fq-tot").textContent=eur(t*1.1)};
  calc();$("#fq-lines").addEventListener("input",calc);
}


function rapportoView(r){
  return `<div><div class="sec-t">Rapportino firmato · ${esc(r.firmato)}</div>
    <ul class="checklist">${r.checks.map(c=>`<li class="${c.ok?"":"no"}">${esc(c.t)}</li>`).join("")}</ul></div>
    ${r.misure?`<div class="measures"><div><b>${esc(r.misure.p)}</b><span>bar pressione bassa</span></div><div><b>${esc(r.misure.t)} °C</b><span>temperatura mandata</span></div><div><b>${esc(r.misure.a)} A</b><span>assorbimento</span></div></div>`:""}
    <dl class="dl"><dt>Ore lavorate</dt><dd class="num">${esc(r.ore)} h</dd>${r.mat?`<dt>Materiali</dt><dd>${esc(r.mat)}</dd>`:""}${r.note?`<dt>Note</dt><dd>${esc(r.note)}</dd>`:""}</dl>
    ${r.foto&&r.foto.length?`<div><div class="sec-t">Foto</div><div class="thumbs">${r.foto.map(f=>`<img src="${f}" alt="Foto intervento">`).join("")}</div></div>`:""}
    <div><div class="sec-t">Firma del cliente</div><img class="sig-img" src="${r.firma}" alt="Firma del cliente"></div>`;
}

function rapportinoForm(id){
  const i=db.interventi.find(x=>x.id===id);const c=cli(i.cliente);const u=db.unita.find(x=>x.id===i.unita);
  const fgas=u&&co2(u)>=5;
  const checks={
    man:["Pulizia e sanificazione filtri","Sanificazione batteria unità interna","Pulizia batteria unità esterna","Verifica scarico condensa","Controllo serraggi e isolamento linee"].concat(fgas?["Controllo perdite F-gas con cercafughe elettronico"]:[]),
    inst:["Staffaggio e messa in bolla delle unità","Prova di tenuta con azoto","Vuoto impianto sotto 500 micron","Apertura rubinetti e verifica carica","Spiegazione uso e telecomando al cliente"],
    gua:["Lettura codice errore","Diagnosi componente guasto","Sostituzione / riparazione","Prova di funzionamento in freddo e caldo"],
    sop:["Rilievo misure dei locali","Scelta posizione unità interne ed esterna","Verifica linea elettrica dedicata","Foto per il preventivo"]
  }[i.tipo];
  rapFoto=[];sigDirty=false;
  openDrawer("Rapportino di intervento",esc(c.nome)+" · "+fmtD(i.data)+" · "+TIPI[i.tipo],`<form id="f-rap" data-id="${id}" class="grid" style="gap:12px">
    <div class="sec-t" style="margin:0">Checklist</div>
    ${checks.map((t,k)=>`<label class="check"><input type="checkbox" id="fr-c${k}" checked> ${t}</label>`).join("")}
    ${i.tipo==="sop"?"":`<div class="sec-t" style="margin:6px 0 0">Misure rilevate</div><div class="row r3"><label>Pressione (bar)<input id="fr-p" inputmode="decimal" value="8,6"></label><label>T mandata (°C)<input id="fr-t" inputmode="decimal" value="9,5"></label><label>Assorb. (A)<input id="fr-a" inputmode="decimal" value="3,2"></label></div>`}
    <div class="row"><label>Ore lavorate<input id="fr-ore" type="number" min="0.5" step="0.5" value="${i.dur}"></label><label>Importo (€)<input id="fr-imp" type="number" min="0" step="5" value="${i.importo}"></label></div>
    <label>Materiali utilizzati<input id="fr-mat" value="${i.tipo==="man"?"Igienizzante per batterie, spray schiumogeno":""}" placeholder="es. condensatore 35 µF, 3 m di tubo"></label>
    <label>Note per il cliente<textarea id="fr-note">${i.tipo==="man"?"Impianto pulito e funzionante. Consigliata prossima manutenzione tra 12 mesi.":""}</textarea></label>
    <label>Foto dell'intervento<input id="fr-foto" type="file" accept="image/*" multiple></label>
    <div class="thumbs" id="fr-thumbs"></div>
    <div><div class="sec-t">Firma del cliente</div><canvas class="sig" id="fr-sig" aria-label="Spazio per la firma"></canvas>
      <div style="display:flex;justify-content:space-between;margin-top:4px"><span class="cell-sub">Firma con il dito o con il mouse</span><button type="button" class="copy" data-sig-clear>Cancella firma</button></div></div>
    <div class="form-actions"><button type="button" class="btn" data-close>Annulla</button><button class="btn primary">Chiudi intervento</button></div></form>`);
  setupSig();
  $("#fr-foto").addEventListener("change",e=>{[...e.target.files].slice(0,4).forEach(f=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);rapFoto.push(cv.toDataURL("image/jpeg",.7));$("#fr-thumbs").innerHTML=rapFoto.map(s=>`<img src="${s}" alt="">`).join("")};im.src=rd.result};rd.readAsDataURL(f)})});
}
function setupSig(){
  const cv=$("#fr-sig");const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  x.lineWidth=2.2;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#10202c";
  let down=false;const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);const [a,b]=pos(e);x.beginPath();x.moveTo(a,b)});
  cv.addEventListener("pointermove",e=>{if(!down)return;const [a,b]=pos(e);x.lineTo(a,b);x.stroke();sigDirty=true});
  const up=()=>{down=false};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
}

function reminderText(u,ch){
  const c=cli(u.cliente);const d=daysTo(u.prossimaMan);const fgas=co2(u)>=5;
  const nome=c.tipo==="privato"?c.nome.split(" ")[0]:c.nome;
  const prop=addDays(today,3+(today.getDay()===3?2:0));
  const body=`Buongiorno ${nome}, sono Luis di Rodriguez Impianti.\nLa manutenzione del climatizzatore ${u.marca} ${u.modello} ${d<0?"è scaduta il "+fmtD(u.prossimaMan):"scade il "+fmtD(u.prossimaMan)}.${fgas?"\nPer questo impianto il controllo perdite F-gas è obbligatorio per legge.":""}\nLe propongo ${fmtDay(iso(prop))} alle 9:00. ${ch==="email"?"Risponda a questa email per confermare o proporre un altro giorno.":"Risponda SÌ per confermare o mi scriva un altro giorno."}\nGrazie!`;
  return ch==="email"?`Oggetto: Manutenzione climatizzatore\n\n${body}\n\nRodriguez Impianti`:body;
}
function reminderDrawer(id){
  const u=db.unita.find(x=>x.id===id);const c=cli(u.cliente);
  openDrawer("Promemoria manutenzione",esc(c.nome)+" · "+esc(c.tel),`<form id="f-rem" data-id="${id}" class="grid" style="gap:12px">
    <label>Canale<select id="rm-ch"><option value="wa">WhatsApp</option><option value="sms">SMS</option><option value="email">Email</option></select></label>
    <label>Messaggio<textarea id="rm-text" style="min-height:170px">${esc(reminderText(u,"wa"))}</textarea></label>
    <div><div class="sec-t">Anteprima</div><div class="wa" id="rm-prev"></div></div>
    <p class="muted" style="font-size:13px;margin:0">Nella versione completa il messaggio parte in automatico 30 giorni prima della scadenza. In questa demo viene solo registrato.</p>
    <div class="form-actions"><button type="button" class="btn" data-close>Annulla</button><button class="btn primary">Invia promemoria</button></div></form>`);
  previewRem();
  $("#rm-ch").addEventListener("change",()=>{$("#rm-text").value=reminderText(u,$("#rm-ch").value);previewRem()});
}
function previewRem(){
  const ch=$("#rm-ch").value;const box=$("#rm-prev");
  box.className="wa "+(ch==="wa"?"":ch==="sms"?"sms":"mail");
  box.innerHTML=`<div class="wa-msg">${esc($("#rm-text").value)}<div class="wa-meta">${new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}${ch==="wa"?" ✓✓":""}</div></div>`;
}

function showLogin(){
  let ok=false;try{ok=sessionStorage.getItem("rcrm-auth")==="1"}catch(e){}
  if(ok)return;
  const el=document.createElement("div");el.className="login";
  el.innerHTML=`<form class="login-card" id="f-login">
    <div class="brand" style="padding:0"><div class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11"/><path d="M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5"/></svg></div><div><div class="brand-name">Rodriguez Impianti</div><div class="brand-sub" style="color:#a9c3d3">Gestione clienti</div></div></div>
    <h2>Accedi al gestionale</h2>
    <p>Clienti, impianti, interventi e scadenze in un unico posto. Da ufficio e da telefono.</p>
    <label>Email<input id="lg-email" type="email" value="luis@rodriguezimpianti.it" autocomplete="username"></label>
    <label>Password<input id="lg-pass" type="password" value="demo-2026" autocomplete="current-password"></label>
    <button class="btn primary">Entra nella demo</button>
    <div class="login-feat"><span>Agenda tecnici</span><span>Rapportino con firma</span><span>Promemoria WhatsApp</span><span>Registro F-gas</span><span>Preventivi</span></div>
    <div class="login-foot">Versione dimostrativa con dati di esempio</div></form>`;
  document.body.appendChild(el);
}

/* ---------- toast ---------- */
let tt;function toast(m){clearTimeout(tt);let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2600)}

/* ---------- render & eventi ---------- */
function render(){
  renderNav();
  const fn={dashboard:vDashboard,clienti:vClienti,impianti:vImpianti,agenda:vAgenda,preventivi:vPreventivi,scadenze:vScadenze}[view];
  const hadFocus=document.activeElement&&document.activeElement.id==="q";
  $("#main").innerHTML=fn();
  if(hadFocus){const i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
let pending=null;
const go=(v,fn)=>{if(location.hash.slice(1)===v){render();fn()}else{pending=fn;location.hash=v}};
function route(){const h=location.hash.slice(1);const nv=VIEWS.some(v=>v[0]===h)?h:"dashboard";if(nv!==view){filt="tutti";q=""}view=nv;closeDrawer();render();window.scrollTo(0,0);if(pending){const f=pending;pending=null;f()}}
window.addEventListener("hashchange",route);

document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;render()}if(e.target.id==="rm-text")previewRem()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-close],[data-cli],[data-int],[data-q],[data-act],[data-filt],[data-done],[data-cancel],[data-qstate],[data-plan],[data-copy],[data-mode],[data-remind],[data-remind-all],[data-sig-clear],#reset");
  if(!t)return;const d=t.dataset;
  if(d.close!==undefined)return closeDrawer();
  if(t.id==="reset"){db=seed();save();render();return toast("Dati demo ripristinati")}
  if(d.copy){navigator.clipboard?.writeText(d.copy).then(()=>toast("Copiato: "+d.copy)).catch(()=>toast(d.copy));return}
  if(d.filt){filt=d.filt;return render()}
  if(d.mode){agMode=d.mode;return render()}
  if(d.remind)return reminderDrawer(d.remind);
  if(d.remindAll!==undefined){const l=db.unita.filter(u=>daysTo(u.prossimaMan)<0&&!u.promemoria);l.forEach(u=>u.promemoria=iso(today));save();render();return toast(l.length+" promemoria registrati (demo: nessun messaggio inviato)")}
  if(d.sigClear!==undefined){const cv=$("#fr-sig");cv.getContext("2d").clearRect(0,0,cv.width,cv.height);sigDirty=false;return}
  if(d.act==="new-cli")return formCliente();
  if(d.act==="new-int")return formIntervento(d.for);
  if(d.act==="new-q")return formPreventivo(d.for);
  if(d.plan){const u=db.unita.find(x=>x.id===d.plan);return formIntervento(u.cliente,u.id)}
  if(d.done)return rapportinoForm(d.done);
  if(d.cancel){db.interventi.find(x=>x.id===d.cancel).stato="annullato";save();closeDrawer();render();return toast("Intervento annullato")}
  if(d.qstate){const p=db.preventivi.find(x=>x.id===d.qid);p.stato=d.qstate;save();render();preventivoDrawer(p.id);return toast("Preventivo "+p.id+": "+d.qstate)}
  if(d.int)return interventoDrawer(d.int);
  if(d.q)return preventivoDrawer(d.q);
  if(d.cli)return clienteDrawer(d.cli);
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;const v=id=>$("#"+id).value.trim();
  if(f.id==="f-login"){try{sessionStorage.setItem("rcrm-auth","1")}catch(e){}f.parentElement.remove();toast("Bentornato, Luis");return}
  if(f.id==="f-rap"){
    if(!sigDirty)return toast("Manca la firma del cliente");
    const i=db.interventi.find(x=>x.id===f.dataset.id);
    const checks=[...f.querySelectorAll("label.check")].map(l=>({t:l.textContent.trim(),ok:l.querySelector("input").checked}));
    i.rapporto={checks,misure:$("#fr-p")?{p:v("fr-p"),t:v("fr-t"),a:v("fr-a")}:null,ore:v("fr-ore"),mat:v("fr-mat"),note:v("fr-note"),foto:rapFoto.slice(),firma:$("#fr-sig").toDataURL("image/png"),firmato:new Date().toLocaleString("it-IT",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
    i.importo=+v("fr-imp")||0;i.stato="completato";
    if(i.tipo==="man"){const us=i.unita?db.unita.filter(u=>u.id===i.unita):unitsOf(i.cliente);us.forEach(u=>{u.prossimaMan=iso(addDays(parse(i.data),365));u.promemoria=null})}
    save();render();interventoDrawer(i.id);return toast("Intervento chiuso, rapportino firmato salvato")}
  if(f.id==="f-rem"){const u=db.unita.find(x=>x.id===f.dataset.id);u.promemoria=iso(today);save();closeDrawer();render();return toast("Promemoria registrato (demo: nessun messaggio inviato)")}
  if(f.id==="f-cli"){const c={id:uid("c"),nome:v("fc-nome"),tipo:v("fc-tipo"),tel:v("fc-tel"),email:v("fc-email"),ind:v("fc-ind"),citta:v("fc-citta"),prov:v("fc-prov").toUpperCase(),note:v("fc-note"),cf:"",creato:iso(today)};
    db.clienti.unshift(c);save();go("clienti",()=>clienteDrawer(c.id));toast("Cliente salvato")}
  if(f.id==="f-int"){const i={id:uid("i"),cliente:v("fi-cli"),unita:v("fi-unit")||null,tipo:v("fi-tipo"),data:v("fi-data"),ora:v("fi-ora"),tecnico:v("fi-tec"),stato:"pianificato",descr:v("fi-descr"),importo:+v("fi-imp")||0,dur:+v("fi-dur")||2};
    db.interventi.push(i);save();closeDrawer();render();toast("Intervento pianificato per il "+fmtD(i.data))}
  if(f.id==="f-q"){const n=Math.max(...db.preventivi.map(p=>+p.id.split("-")[2]))+1;const righe=[0,1,2].map(k=>[v("fq-d"+k),+v("fq-q"+k)||0,+v("fq-p"+k)||0]).filter(r=>r[0]&&r[1]);
    const p={id:"P-"+today.getFullYear()+"-"+String(n).padStart(3,"0"),cliente:v("fq-cli"),data:iso(today),stato:"bozza",oggetto:v("fq-ogg"),detrazione:v("fq-det"),righe};
    db.preventivi.push(p);save();go("preventivi",()=>preventivoDrawer(p.id));toast("Preventivo "+p.id+" salvato")}
});
route();
showLogin();
})();
</script>
